<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligent Painter V1</title>
<style>
    /* Layout: robot stage on the left, sensor name on the right; stacks on phones */
    :root {
        --bg: #f0f4f8;
        --card: #ffffff;
        --stage: #e2e8f0;
        --stage-border: #cbd5e1;
        --panel: #f8fafc;
        --panel-border: #e2e8f0;
        --heading: #1a365d;
        --muted: #4a5568;
        --title: #1e3a8a;
        --shadow: rgba(0,0,0,0.05);
        --wall: #d3dbe5;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #0f1722; --card: #17212f; --stage: #223044; --stage-border: #33445c;
            --panel: #1c2838; --panel-border: #2c3b50; --heading: #dbe7f7; --muted: #a3b2c6;
            --title: #93c5fd; --shadow: rgba(0,0,0,0.4); --wall: #3a4b62; color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #0f1722; --card: #17212f; --stage: #223044; --stage-border: #33445c;
        --panel: #1c2838; --panel-border: #2c3b50; --heading: #dbe7f7; --muted: #a3b2c6;
        --title: #93c5fd; --shadow: rgba(0,0,0,0.4); --wall: #3a4b62; color-scheme: dark;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--heading);
        margin: 0;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h1 {
        color: var(--heading);
        margin: 0 0 5px;
        text-align: center;
        text-wrap: balance;
    }
    .subtitle {
        color: var(--muted);
        margin-bottom: 20px;
        font-size: 1.1em;
        text-align: center;
    }
    .container {
        display: flex;
        flex-wrap: wrap;
        background: var(--card);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 25px var(--shadow);
        max-width: 1400px;
        width: 100%;
        box-sizing: border-box;
        gap: 30px;
    }
    .stage-wrap {
        flex: 3 1 608px;
        min-width: 0;
        /* as large as possible while the whole robot stays on screen */
        max-width: min(100%, calc((100vh - 190px) * 608 / 508));
        aspect-ratio: 608 / 508;
        position: relative;
    }
    .robot-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 500px;
        transform-origin: top left;
        background: var(--stage);
        border-radius: 15px;
        border: 4px dashed var(--stage-border);
        overflow: hidden;
    }
    /* Cartoon Art Elements */
    .cartoon-element {
        position: absolute;
        background: #475569;
        border: 4px solid #0f172a;
        border-radius: 8px;
    }
    /* LiDAR: a 3D puck (lit top cap + shaded cylinder) with a sensor window sweeping around it */
    .lidar { position: absolute; left: 268px; top: 50px; width: 72px; height: 58px; z-index: 2; }
    .lidar-body {
        position: absolute; left: 0; top: 10px; width: 72px; height: 46px;
        box-sizing: border-box;
        border: 4px solid #0f172a; border-top: none;
        border-radius: 0 0 36px 36px / 0 0 12px 12px;
        background: linear-gradient(90deg, #1e293b 0%, #64748b 28%, #a3b1c2 40%, #475569 68%, #1e293b 100%);
        overflow: hidden;
    }
    .lidar-band {
        position: absolute; left: 0; right: 0; top: 12px; height: 14px;
        background: linear-gradient(90deg, #020617 0%, #1e293b 35%, #334155 45%, #0f172a 75%, #020617 100%);
    }
    .lidar-window {
        position: absolute; left: 0; top: 14px; width: 18px; height: 10px;
        background: #38bdf8; border-radius: 3px;
        box-shadow: 0 0 8px #38bdf8;
        animation: lidar-sweep 1.4s infinite linear;
    }
    .lidar-top {
        position: absolute; left: 0; top: 0; width: 72px; height: 22px;
        box-sizing: border-box;
        border: 4px solid #0f172a; border-radius: 50%;
        background: radial-gradient(ellipse at 38% 35%, #e2e8f0 0%, #94a3b8 45%, #475569 100%);
    }
    .neck { width: 20px; height: 132px; top: 100px; left: 290px; background: #64748b; }
    .arm-joint-1 {
        width: 30px; height: 120px; top: 130px; left: 310px;
        background: #f59e0b;
        transform: rotate(-30deg);
        transform-origin: top left;
    }
    .arm-joint-2 {
        width: 25px; height: 100px; top: 210px; left: 380px;
        background: #d97706;
        transform: rotate(45deg);
        transform-origin: top left;
    }
    .art { position: absolute; inset: 0; width: 600px; height: 500px; pointer-events: none; }
    .wall { fill: var(--wall); }
    .floor { stroke: var(--stage-border); }
    .chassis { width: 220px; height: 140px; top: 240px; left: 190px; background: #1e293b; border-radius: 20px; }
    .camera-eye { width: 50px; height: 25px; top: 215px; left: 205px; background: #0f172a; border-radius: 6px; }
    .wheel {
        width: 70px; height: 70px;
        background: #0f172a;
        border: 5px solid #334155;
        border-radius: 50%;
        position: absolute;
    }
    .w1 { top: 350px; left: 160px; }
    .w2 { top: 350px; left: 370px; }

    /* Interactive Hotspots */
    .hotspot {
        position: absolute;
        width: 20px;
        height: 20px;
        margin: 5px;
        padding: 0;
        background: #3b82f6;
        border: 2px solid white;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(59,130,246,0.8);
        animation: pulse 2s infinite;
        z-index: 10;
        transition: scale 0.15s;
    }
    .hotspot:hover, .hotspot:focus-visible { background: #10b981; scale: 1.2; }
    .hotspot:focus-visible { outline: 3px solid #10b981; outline-offset: 2px; }
    .hotspot.active { background: #10b981; }

    /* Name Panel */
    .info-panel {
        flex: 1 1 220px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        background: var(--panel);
        border-radius: 15px;
        border: 2px solid var(--panel-border);
    }
    .info-title {
        font-size: 1.6em;
        color: var(--title);
        margin: 0;
        text-wrap: balance;
    }

    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
        70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(59,130,246,0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }
    .hose-flow { animation: hose-flow 0.8s infinite linear; }
    @keyframes hose-flow { to { stroke-dashoffset: -32; } }
    @keyframes lidar-sweep {
        0%   { transform: translateX(-18px) scaleX(0.2); opacity: 0.4; }
        25%  { transform: translateX(8px) scaleX(0.75); opacity: 1; }
        50%  { transform: translateX(27px) scaleX(1); opacity: 1; }
        75%  { transform: translateX(46px) scaleX(0.75); opacity: 1; }
        100% { transform: translateX(72px) scaleX(0.2); opacity: 0.4; }
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
        .hotspot, .lidar-window, .hose-flow { animation: none; }
    }
</style>
</head>
<body>

<h1>Intelligent Painter V1</h1>
<div class="subtitle">Click the flashing blue nodes to explore.</div>

<div class="container">
    <div class="stage-wrap" id="stage-wrap">
        <div class="robot-canvas" id="stage">
            <div class="cartoon-element neck"></div>
            <div class="lidar">
                <div class="lidar-body"><div class="lidar-band"></div><div class="lidar-window"></div></div>
                <div class="lidar-top"></div>
            </div>
            <div class="cartoon-element chassis"></div>
            <div class="cartoon-element camera-eye"></div>
            <svg class="art" viewBox="0 0 600 500" aria-hidden="true">
                <!-- Room: floor, ceiling and the wall being painted -->
                <line class="floor" x1="0" y1="432" x2="600" y2="432" stroke-width="4"/>
                <rect class="wall" x="400" y="0" width="200" height="12"/>
                <rect class="wall" x="575" y="0" width="40" height="432"/>
                <!-- Control tablet with wireless link -->
                <rect x="48" y="150" width="104" height="72" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
                <rect x="58" y="159" width="84" height="54" rx="4" fill="#bfdbfe"/>
                <rect x="64" y="166" width="72" height="18" rx="2" fill="#93c5fd"/>
                <rect x="64" y="196" width="72" height="8" rx="4" fill="#e2e8f0"/>
                <rect x="64" y="196" width="44" height="8" rx="4" fill="#10b981"/>
                <g fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round">
                    <path d="M162 174 Q170 186 162 198"/>
                    <path d="M172 166 Q184 186 172 206"/>
                    <path d="M182 158 Q198 186 182 214"/>
                </g>

                <!-- Paint storage tank on the body -->
                <rect x="228" y="258" width="20" height="12" rx="2" fill="#64748b" stroke="#0f172a" stroke-width="3"/>
                <rect x="212" y="268" width="52" height="86" rx="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
                <rect x="216" y="300" width="44" height="50" rx="6" fill="#a855f7">
                    <animate attributeName="y" values="296;326;296" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
                    <animate attributeName="height" values="54;24;54" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
                </rect>

                <!-- Paint pump with pressure gauge -->
                <rect x="318" y="290" width="60" height="48" rx="6" fill="#64748b" stroke="#0f172a" stroke-width="4"/>
                <circle cx="348" cy="314" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
                <line x1="348" y1="314" x2="355" y2="306" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

                <!-- Emergency stop button -->
                <rect x="324" y="228" width="30" height="14" rx="3" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
                <circle cx="339" cy="224" r="10" fill="#ef4444" stroke="#0f172a" stroke-width="3"/>

                <!-- Robotic arm: shoulder on the body, elbow, wrist at the nozzle -->
                <path d="M380 240 L440 150 L474 262" fill="none" stroke="#0f172a" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="380" y1="240" x2="440" y2="150" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
                <line x1="440" y1="150" x2="474" y2="262" stroke="#d97706" stroke-width="22" stroke-linecap="round"/>
                <circle cx="380" cy="240" r="17" fill="#475569" stroke="#0f172a" stroke-width="4"/>
                <circle cx="440" cy="150" r="15" fill="#475569" stroke="#0f172a" stroke-width="4"/>

                <!-- Paint hose: tank to pump, pump up along the arm to the nozzle -->
                <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M238 258 C238 232 300 240 318 300 M360 290 C360 262 362 242 367 231 L427 141 Q440 122 453 146 L486 236" stroke="#0f172a" stroke-width="9"/>
                    <path d="M238 258 C238 232 300 240 318 300 M360 290 C360 262 362 242 367 231 L427 141 Q440 122 453 146 L486 236" stroke="#a855f7" stroke-width="4"/>
                    <path class="hose-flow" d="M238 258 C238 232 300 240 318 300 M360 290 C360 262 362 242 367 231 L427 141 Q440 122 453 146 L486 236" stroke="#e9d5ff" stroke-width="2.5" stroke-dasharray="5 11"/>
                </g>
                <circle cx="397" cy="186" r="5" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
                <circle cx="470" cy="203" r="5" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>

                <!-- Paint on the wall: edge-pad band at the ceiling, wet spray ahead, smooth rolled coat behind -->
                <rect x="569" y="12" width="6" height="26" fill="#a855f7"/>
                <rect x="569" y="301" width="6" height="131" fill="#a855f7"/>
                <g transform="translate(476 262) scale(1.5) translate(-476 -262)">
                <g fill="#a855f7">
                    <rect x="543" y="214" width="5" height="6"/><rect x="545" y="224" width="3" height="5"/>
                    <rect x="542" y="232" width="6" height="8"/><rect x="544" y="244" width="4" height="4"/>
                    <rect x="542" y="252" width="6" height="10"/><rect x="545" y="266" width="3" height="5"/>
                    <rect x="542" y="274" width="6" height="14"/>
                </g>

                <!-- Hybrid head: tool plate with laser gauge, spray nozzle on top, sprung roller below -->
                <circle cx="476" cy="262" r="10" fill="#475569" stroke="#0f172a" stroke-width="4"/>
                <rect x="482" y="220" width="16" height="100" rx="4" fill="#475569" stroke="#0f172a" stroke-width="4"/>
                <rect x="482" y="204" width="16" height="14" rx="3" fill="#334155" stroke="#0f172a" stroke-width="3"/>
                <line x1="498" y1="211" x2="542" y2="211" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
                <path d="M526 234 L542 212 L542 256 Z" fill="#a855f7" opacity="0.35"/>
                <g fill="#a855f7">
                    <circle r="1.8"><animate attributeName="cx" values="527;542" dur="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="234;218" dur="0.6s" repeatCount="indefinite"/></circle>
                    <circle r="1.8"><animate attributeName="cx" values="527;542" dur="0.6s" begin="-0.15s" repeatCount="indefinite"/><animate attributeName="cy" values="234;240" dur="0.6s" begin="-0.15s" repeatCount="indefinite"/></circle>
                    <circle r="1.5"><animate attributeName="cx" values="527;542" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="234;226" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/></circle>
                    <circle r="1.5"><animate attributeName="cx" values="527;542" dur="0.6s" begin="-0.45s" repeatCount="indefinite"/><animate attributeName="cy" values="234;250" dur="0.6s" begin="-0.45s" repeatCount="indefinite"/></circle>
                </g>
                <rect x="496" y="224" width="26" height="20" rx="4" fill="#ef4444" stroke="#0f172a" stroke-width="4"/>
                <rect x="521" y="229" width="6" height="10" fill="#0f172a"/>
                <polyline points="498,300 501,293 504,307 507,293 510,307 513,300" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
                <line x1="513" y1="300" x2="528" y2="300" stroke="#0f172a" stroke-width="4"/>
                <circle cx="528" cy="300" r="14" fill="#a855f7" stroke="#0f172a" stroke-width="4"/>
                <circle cx="528" cy="300" r="4" fill="#0f172a"/>
                </g>
            </svg>
            <div class="wheel w1"></div>
            <div class="wheel w2"></div>

            <button class="hotspot" style="top: 64px; left: 334px;" data-key="lidar" aria-label="LiDAR Navigation Sensors"></button>
            <button class="hotspot" style="top: 202px; left: 215px;" data-key="spatial" aria-label="Spatial AI Cameras and CPU"></button>
            <button class="hotspot" style="top: 163px; left: 484px;" data-key="laser" aria-label="Laser Distance Gauge Edge Sensors"></button>
            <button class="hotspot" style="top: 205px; left: 510px;" data-key="flow" aria-label="Flow / Pressure Sensor"></button>
            <button class="hotspot" style="top: 377px; left: 237px;" data-key="sonar" aria-label="Ultrasonic Sonar Sensors"></button>
            <button class="hotspot" style="top: 372px; left: 387px;" data-key="encoders" aria-label="Wheel Encoders"></button>
            <button class="hotspot" style="top: 171px; left: 85px;" data-key="tablet" aria-label="Control Tablet and App"></button>
            <button class="hotspot" style="top: 285px; left: 223px;" data-key="tank" aria-label="Paint Storage Tank"></button>
            <button class="hotspot" style="top: 299px; left: 333px;" data-key="pump" aria-label="Paint Pump and Spray System"></button>
            <button class="hotspot" style="top: 196px; left: 324px;" data-key="estop" aria-label="Emergency Stop"></button>
            <button class="hotspot" style="top: 171px; left: 382px;" data-key="hose" aria-label="Cable and Hose Management"></button>
            <button class="hotspot" style="top: 254px; left: 482px;" data-key="head" aria-label="Hybrid Spray and Roller Head"></button>
            <button class="hotspot" style="top: 304px; left: 539px;" data-key="roller" aria-label="Back-Roller"></button>
            <button class="hotspot" style="top: 328px; left: 504px;" data-key="force" aria-label="Force and Contact Sensor"></button>
            <button class="hotspot" style="top: 15px; left: 557px;" data-key="edges" aria-label="Edges: Robot Edge Pad"></button>
        </div>
    </div>

    <div class="info-panel" aria-live="polite">
        <h2 class="info-title" id="info-title">Tap a node...</h2>
    </div>
</div>

<script>
    const sensorTitles = {
        tablet: "📱 Control Tablet / App",
        tank: "🪣 Paint Storage Tank",
        pump: "💦 Paint Pump / Spray System",
        estop: "🛑 Emergency Stop",
        hose: "🔌 Cable & Hose Management",
        head: "🔀 Hybrid Spray + Roller Head",
        roller: "🧽 Back-Roller",
        force: "🗜️ Force / Contact Sensor",
        edges: "🖌️ Edges: Robot Edge Pad",
        lidar: "🔄 LiDAR Navigation Sensors",
        spatial: "🧠 Spatial AI Cameras & CPU",
        laser: "📏 Laser Distance Gauge Edge Sensors",
        flow: "🩸 Flow / Pressure Sensor",
        sonar: "🦇 Ultrasonic Sonar Sensors",
        encoders: "⚙️ Wheel Encoders"
    };

    const title = document.getElementById('info-title');
    document.querySelectorAll('.hotspot').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.hotspot.active').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            title.textContent = sensorTitles[btn.dataset.key];
        });
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelector('.art').pauseAnimations();
    }

    // Scale the fixed-size 608x508 drawing to fit its column
    const wrap = document.getElementById('stage-wrap');
    const stage = document.getElementById('stage');
    const fit = () => { stage.style.transform = `scale(${wrap.clientWidth / 608})`; };
    new ResizeObserver(fit).observe(wrap);
    fit();
</script>
</body>
</html>
